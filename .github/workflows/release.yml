name: Release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      package_file: ${{ steps.pack.outputs.package_file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run release:check
      - run: npm run benchmark:smoke
      - id: pack
        run: |
          PACKAGE_FILE=$(node -e "const { spawnSync } = require('node:child_process'); const result = spawnSync('npm', ['pack', '--json', '--silent'], { encoding: 'utf8' }); if (result.status !== 0) { process.stderr.write(result.stderr || result.stdout); process.exit(result.status || 1); } const lines = result.stdout.split(/\r?\n/).map((line) => line.trim()).filter(Boolean); const jsonStart = lines.findIndex((line) => line.startsWith('[')); if (jsonStart < 0) { throw new Error('npm pack --json did not produce JSON output'); } const report = JSON.parse(lines.slice(jsonStart).join('')); process.stdout.write(report[0].filename);")
          echo "package_file=${PACKAGE_FILE}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.package_file }}
      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  standalone:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: local-code-agent-linux-x64
            artifact_path: dist/release-assets/local-code-agent-linux-x64
          - os: macos-latest
            artifact_name: local-code-agent-darwin-arm64
            artifact_path: dist/release-assets/local-code-agent-darwin-arm64
          - os: windows-latest
            artifact_name: local-code-agent-win32-x64.exe
            artifact_path: dist\release-assets\local-code-agent-win32-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prepare:standalone:release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

  github-release:
    needs: [package, standalone]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/npm-package/${{ needs.package.outputs.package_file }}
            release-artifacts/local-code-agent-linux-x64/local-code-agent-linux-x64
            release-artifacts/local-code-agent-darwin-arm64/local-code-agent-darwin-arm64
            release-artifacts/local-code-agent-win32-x64.exe/local-code-agent-win32-x64.exe
          generate_release_notes: true
